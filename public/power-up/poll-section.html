<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polls</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #22272b;
        color: #b6c2cf;
        padding: 8px 4px;
      }
      .manage-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 8px;
      }
      .manage-btn {
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        cursor: pointer;
      }
      .manage-btn:hover {
        background: #3d454b;
      }
      .poll-block {
        margin-bottom: 18px;
      }
      .poll-block:last-child {
        margin-bottom: 0;
      }
      .question {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .option-btn {
        width: 100%;
        text-align: center;
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 14px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .option-btn:hover {
        background: #3d454b;
      }
    </style>
  </head>
  <body>
    <div class="manage-row">
      <button class="manage-btn" id="manage-btn" type="button">Manage</button>
    </div>
    <div id="polls-container"></div>

    <script src="./poll-section.js"></script>
  </body>
</html>
