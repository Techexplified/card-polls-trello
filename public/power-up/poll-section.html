<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polls</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #22272b;
        color: #b6c2cf;
        padding: 8px 4px;
      }
      .manage-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 8px;
      }
      .manage-btn {
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        cursor: pointer;
      }
      .manage-btn:hover {
        background: #3d454b;
      }
      .poll-block {
        margin-bottom: 18px;
      }
      .poll-block:last-child {
        margin-bottom: 0;
      }
      .question {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .result-row {
        position: relative;
        width: 100%;
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 14px;
        padding: 10px 12px;
        margin-bottom: 8px;
        overflow: hidden;
        text-align: left;
        display: flex;
        align-items: center;
      }
      .result-row.voted {
        color: #ffffff;
      }
      .result-fill {
        position: absolute;
        inset: 0;
        background: #669df1;
        z-index: 0;
        border-radius: 4px;
      }
      .result-label {
        position: relative;
        z-index: 1;
        font-weight: 600;
      }
      .avatar {
        position: relative;
        z-index: 1;
        margin-left: auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #5e4db2;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .poll-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #8c9bab;
        margin-top: 4px;
      }
      .link-btn {
        background: none;
        border: none;
        color: #669df1;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }
      .link-btn:hover {
        text-decoration: underline;
      }

      .add-option-link {
        background: none;
        border: none;
        color: #669df1;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 0;
        display: block;
        text-align: center;
        width: 100%;
      }
      .add-option-link:hover {
        text-decoration: underline;
      }

      .add-option-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 4px;
      }
      .add-option-input {
        flex: 1;
        margin-bottom: 0;
        border-color: #669df1;
      }
      .confirm-btn,
      .cancel-btn {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .confirm-btn {
        background: #669df1;
        color: #101204;
      }
      .confirm-btn:hover {
        background: #85b8ff;
      }
      .cancel-btn {
        background: #333a3f;
        color: #b6c2cf;
      }
      .cancel-btn:hover {
        background: #3d454b;
      }

      .option-btn.selected {
        background: #e0a800;
        color: #1c1c1c;
      }

      .submit-vote-btn {
        width: 100%;
        margin-top: 4px;
        padding: 10px 12px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        background: #333a3f;
        color: #8c9bab;
        cursor: not-allowed;
      }
      .submit-vote-btn.enabled {
        background: #669df1;
        color: #101204;
        cursor: pointer;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .option-btn {
        width: 100%;
        text-align: center;
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 14px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .option-btn:hover {
        background: #3d454b;
      }
    </style>
  </head>
  <body>
    <div class="manage-row">
      <button class="manage-btn" id="manage-btn" type="button">Manage</button>
    </div>
    <div id="polls-container"></div>

    <script src="./poll-section.js"></script>
  </body>
</html>
