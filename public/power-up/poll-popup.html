<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add a Poll</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #22272b;
        color: #b6c2cf;
      }
      #app {
        position: relative;
        padding: 16px;
        min-height: 200px;
      }

      /* --- Poll builder (the thing behind the auth overlay) --- */
      /* --- Poll builder form (shown after authorization) --- */
      #poll-form {
        padding-top: 4px;
      }

      .tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid #3c4045;
        margin-bottom: 14px;
      }
      .tab {
        background: none;
        border: none;
        color: #8c9bab;
        font-size: 14px;
        font-weight: 600;
        padding: 0 0 8px;
        cursor: pointer;
      }
      .tab.active {
        color: #669df1;
        border-bottom: 2px solid #669df1;
      }

      .poll-input {
        width: 100%;
        background: transparent;
        border: 1px solid #5a6570;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 14px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .poll-input::placeholder {
        color: #8c9bab;
      }
      .poll-input:focus {
        outline: none;
        border-color: #669df1;
      }

      .add-option-btn {
        width: 100%;
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 12px;
        margin-bottom: 14px;
        cursor: pointer;
      }
      .add-option-btn:hover {
        background: #3d454b;
      }

      .option-row {
        position: relative;
      }
      .option-row .poll-input {
        padding-right: 34px;
      }
      .remove-option-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #8c9bab;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 4px;
      }
      .remove-option-btn:hover {
        color: #b6c2cf;
      }

      .submit-row {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .submit-btn {
        flex: 1;
        background: #669df1;
        color: #101204;
        border: none;
        border-radius: 4px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .submit-btn:hover {
        background: #85b8ff;
      }
      .icon-btn {
        width: 40px;
        flex-shrink: 0;
        background: #333a3f;
        border: none;
        border-radius: 4px;
        color: #b6c2cf;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        background: #3d454b;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #b6c2cf;
        margin-bottom: 10px;
        cursor: pointer;
      }

      .poll-type-row {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .poll-type-card {
        flex: 1;
        background: #1d2125;
        border: 1px solid #3c4045;
        border-radius: 6px;
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
        color: #b6c2cf;
      }
      .poll-type-card.active {
        border-color: #669df1;
        background: #202b3d;
      }
      .poll-type-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .poll-type-icon {
        font-size: 16px;
      }
      .poll-type-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid #5a6570;
      }
      .poll-type-card.active .poll-type-dot {
        background: #669df1;
        border-color: #669df1;
      }
      .poll-type-title {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .poll-type-desc {
        font-size: 11px;
        color: #8c9bab;
        line-height: 1.3;
      }

      .quick-reaction-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background: #1d2125;
        border: 1px solid #3c4045;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
      }
      .reaction-emoji-btn {
        background: #2c3339;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .reaction-emoji-btn:hover {
        background: #3d454b;
      }

      .reaction-option-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .reaction-emoji-tile {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        background: #2c3339;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .reaction-label-input {
        margin-bottom: 0;
        flex: 1;
      }
      .trash-btn {
        background: none;
        border: none;
        color: #8c9bab;
        font-size: 15px;
        cursor: pointer;
        padding: 4px;
        flex-shrink: 0;
      }
      .trash-btn:hover {
        color: #e2483d;
      }

      /* --- Authorization overlay --- */
      #auth-overlay {
        position: absolute;
        inset: 0;
        background: rgba(34, 39, 43, 0.96);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      #auth-overlay p {
        margin: 0 0 16px;
        font-size: 14px;
        color: #9fadbc;
        max-width: 260px;
      }
      #authorize-btn {
        background: #0c66e4;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #authorize-btn:hover {
        background: #0055cc;
      }
      #authorize-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .error {
        color: #ae2e24;
        font-size: 12px;
        margin-top: 10px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="poll-form" class="hidden">
        <div class="tabs">
          <button class="tab active" id="tab-new" type="button">New</button>
          <button class="tab" id="tab-recent" type="button">Recent</button>
        </div>

        <div class="poll-type-row">
          <button class="poll-type-card active" id="type-text" type="button">
            <div class="poll-type-header">
              <span class="poll-type-icon">📝</span>
              <span class="poll-type-dot"></span>
            </div>
            <div class="poll-type-title">Text Poll</div>
            <div class="poll-type-desc">
              Standard textual options with basic 2+ add option.
            </div>
          </button>
          <button class="poll-type-card" id="type-reaction" type="button">
            <div class="poll-type-header">
              <span class="poll-type-icon">🎉</span>
              <span class="poll-type-dot"></span>
            </div>
            <div class="poll-type-title">Reaction Poll</div>
            <div class="poll-type-desc">
              Emoji reaction sentiment (thumbs, hearts, flames, rockets).
            </div>
          </button>
        </div>

        <input
          type="text"
          class="poll-input"
          id="poll-question"
          placeholder="What are we voting on?"
        />

        <div id="text-options-section">
          <div id="options-container">
            <input
              type="text"
              class="poll-input"
              id="poll-option-1"
              placeholder="Option 1"
            />
            <input
              type="text"
              class="poll-input"
              id="poll-option-2"
              placeholder="Option 2"
            />
          </div>
          <button class="add-option-btn" id="add-option-btn" type="button">
            Add option
          </button>
        </div>

        <div id="reaction-options-section" class="hidden">
          <div class="quick-reaction-bank" id="quick-reaction-bank"></div>
          <div id="reaction-options-container"></div>
          <button class="add-option-btn" id="add-reaction-btn" type="button">
            + Add Reaction Option
          </button>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="allow-add-options" />
          Allow voters to add options
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="allow-multiple-votes" />
          Allow multiple votes per person
        </label>

        <div class="submit-row">
          <button class="submit-btn" id="add-poll-btn" type="button">
            Add poll to card
          </button>
          <button
            class="icon-btn"
            id="announce-btn"
            type="button"
            title="Post to team chat"
            aria-label="Post to team chat"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3 10v4a1 1 0 001 1h3l5 4V5L7 9H4a1 1 0 00-1 1z"
                fill="currentColor"
              />
              <path
                d="M16 8a4 4 0 010 8"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
              <path
                d="M19 5a8 8 0 010 14"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="auth-overlay">
        <p>To get started, authorize this Power-Up with Trello.</p>
        <button id="authorize-btn">Authorize Card Polls</button>
        <div id="auth-error" class="error hidden"></div>
      </div>
    </div>

    <script src="./poll-popup.js"></script>
  </body>
</html>
