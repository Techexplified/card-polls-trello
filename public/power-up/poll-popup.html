<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add a Poll</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #172b4d;
    }
    #app {
      position: relative;
      padding: 16px;
      min-height: 200px;
    }

    /* --- Poll builder (the thing behind the auth overlay) --- */
    .poll-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.5px;
      width: 160px;
      justify-content: center;
    }
    .pill.yes { background: #1abc9c; color: #06342b; }
    .pill.no { background: #e74c3c; color: #3a0d08; }
    .pill.maybe { background: #f1c40f; color: #4a3900; }

    /* --- Authorization overlay --- */
    #auth-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #auth-overlay p {
      margin: 0 0 16px;
      font-size: 14px;
      color: #44546f;
      max-width: 260px;
    }
    #authorize-btn {
      background: #0c66e4;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #authorize-btn:hover { background: #0055cc; }
    #authorize-btn:disabled { opacity: 0.6; cursor: default; }

    .error {
      color: #ae2e24;
      font-size: 12px;
      margin-top: 10px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div class="poll-options" aria-hidden="true">
      <div class="pill yes">✓ YES</div>
      <div class="pill no">✕ NO</div>
      <div class="pill maybe">★ MAYBE</div>
    </div>

    <div id="auth-overlay">
      <p>To get started, authorize this Power-Up with Trello.</p>
      <button id="authorize-btn">Authorize Card Polls</button>
      <div id="auth-error" class="error hidden"></div>
    </div>
  </div>

  <script src="./poll-popup.js"></script>
</body>
</html>
